<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVPM College Navigation</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>SVPM COLLEGE NAVIGATION</h1>
    <p class="subtitle">Smart Campus Navigation System</p>

    <label for="location">Select your destination</label>

    <select id="location">
      <option value="">-- Select Location --</option>
      <option value="Main Gate">Main Gate</option>
      <option value="Ground">Ground</option>
      <option value="Auditorium">Auditorium</option>
      <option value="Girls Hostel">Girls Hostel</option>
      <option value="Pharmacy">Pharmacy</option>
      <option value="Diploma">Diploma</option>
      <option value="Canteen">Canteen</option>
      <option value="Lawn">Lawn</option>
      <option value="Engineering Building A">Engineering Building A</option>
      <option value="Engineering Building B">Engineering Building B</option>
      <option value="Boys Hostel">Boys Hostel</option>
      <option value="Play Ground">Play Ground</option>
      <option value="SVPM Commerce College">SVPM Commerce College</option>
    </select>

    <p id="message" role="status" aria-live="polite"></p>

    <button id="detailsButton" type="button">Show Details</button>

    <!-- Details appear between the buttons -->
    <section id="details" hidden aria-live="polite"></section>

    <button id="mapButton" type="button">Open Google Maps</button>
    <button id="directionsButton" type="button">Get Directions</button>
  </main>
</body>
</html>
